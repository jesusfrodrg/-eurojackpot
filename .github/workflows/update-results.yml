name: Actualizar resultados Eurojackpot

on:
  schedule:
    - cron: '30 21 * * 2'
    - cron: '30 21 * * 5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obtener resultados
        run: node fetch-results.js

      - name: Guardar data.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Actualizar resultados $(date +'%d/%m/%Y')"
          git push
